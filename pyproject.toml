[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-cortex"
version = "0.3.0"
description = "A local-first engineering brain: deterministic codebase intelligence + durable task memory for AI coding agents. CLI + MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Project Cortex contributors" }]
keywords = [
  "ai-agents", "mcp", "model-context-protocol", "claude", "codex", "opencode",
  "code-intelligence", "tree-sitter", "engineering-memory", "context-engineering",
  "token-efficiency", "code-search", "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "tree-sitter>=0.21,<0.26",
  "tree-sitter-typescript>=0.20",
  "tree-sitter-javascript>=0.20",
  "tree-sitter-python>=0.20",
  "tree-sitter-go>=0.20",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9", "twine>=5"]

[project.urls]
Homepage = "https://github.com/FlamuxDev/project-cortex"
Documentation = "https://github.com/FlamuxDev/project-cortex/tree/main/docs"
Issues = "https://github.com/FlamuxDev/project-cortex/issues"
Source = "https://github.com/FlamuxDev/project-cortex"

[project.scripts]
cortex = "cortex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cortex = ["migrations/*.sql", "data/*.json"]
